<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Traffic Visualizer</title>
    
    <!-- External libraries -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.socket.io/4.4.1/socket.io.min.js"></script>
    
    <!-- This is how Vite will process and include your CSS -->
    <link rel="stylesheet" href="./src/css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>Kubernetes Traffic Visualizer</h1>
            <div class="controls">
                <div class="control-group">
                    <label for="namespace-select">Namespace:</label>
                    <select id="namespace-select">
                        <option value="default">default</option>
                    </select>
                </div>
                <button id="refresh-btn" class="btn">Refresh</button>
            </div>
        </header>
        
        <main class="main-content">
            <div id="visualization-container">
                <svg id="topology-svg"></svg>
            </div>
            
            <div id="details-panel" class="panel">
                <h2>Resource Details</h2>
                <div id="details-content">
                    <p>Select a resource to view details</p>
                </div>
            </div>
        </main>
        
        <footer class="footer">
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-icon ingress"></div>
                    <span>Ingress</span>
                </div>
                <div class="legend-item">
                    <div class="legend-icon service"></div>
                    <span>Service</span>
                </div>
                <div class="legend-item">
                    <div class="legend-icon deployment"></div>
                    <span>Deployment</span>
                </div>
                <div class="legend-item">
                    <div class="legend-icon pod"></div>
                    <span>Pod</span>
                </div>
            </div>
            <div class="status">
                <span id="connection-status">Disconnected</span>
            </div>
        </footer>
    </div>
    
    <!-- Templates for Kubernetes icons -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <!-- Pod icon -->
        <symbol id="icon-pod" viewBox="0 0 32 32">
            <path d="M16,3.2c-0.3,0-0.6,0.1-0.8,0.2L4.5,9.6C4,9.9,3.7,10.4,3.7,11v10c0,0.6,0.3,1.1,0.8,1.4l10.7,6.2c0.3,0.1,0.6,0.2,0.8,0.2 s0.6-0.1,0.8-0.2l10.7-6.2c0.5-0.3,0.8-0.8,0.8-1.4V11c0-0.6-0.3-1.1-0.8-1.4L16.8,3.4C16.6,3.3,16.3,3.2,16,3.2z"/>
        </symbol>
        
        <!-- Service icon -->
        <symbol id="icon-service" viewBox="0 0 32 32">
            <path d="M16,2.4c-7.5,0-13.6,6.1-13.6,13.6S8.5,29.6,16,29.6S29.6,23.5,29.6,16S23.5,2.4,16,2.4z M16,6.4c2.6,0,4.8,2.1,4.8,4.8 c0,2.6-2.1,4.8-4.8,4.8s-4.8-2.1-4.8-4.8C11.2,8.6,13.4,6.4,16,6.4z M16,25.7c-3.2,0-6-1.7-7.6-4.2c0-2.5,5-3.9,7.6-3.9 s7.6,1.4,7.6,3.9C22,24.1,19.2,25.7,16,25.7z"/>
        </symbol>
        
        <!-- Deployment icon -->
        <symbol id="icon-deployment" viewBox="0 0 32 32">
            <path d="M26.3,5.7H5.7C4,5.7,2.6,7.1,2.6,8.8v14.4c0,1.7,1.4,3.1,3.1,3.1h20.6c1.7,0,3.1-1.4,3.1-3.1V8.8C29.4,7.1,28,5.7,26.3,5.7z M9.8,19.1c-1,0-1.8-0.8-1.8-1.8c0-1,0.8-1.8,1.8-1.8s1.8,0.8,1.8,1.8C11.6,18.4,10.8,19.1,9.8,19.1z M16,19.1 c-1,0-1.8-0.8-1.8-1.8c0-1,0.8-1.8,1.8-1.8s1.8,0.8,1.8,1.8C17.8,18.4,17,19.1,16,19.1z M22.2,19.1c-1,0-1.8-0.8-1.8-1.8 c0-1,0.8-1.8,1.8-1.8s1.8,0.8,1.8,1.8C24,18.4,23.2,19.1,22.2,19.1z"/>
        </symbol>
        
        <!-- Ingress icon -->
        <symbol id="icon-ingress" viewBox="0 0 32 32">
            <path d="M28.8,14.9h-4.1V6.8c0-0.6-0.5-1.1-1.1-1.1h-15c-0.6,0-1.1,0.5-1.1,1.1v8.1H3.2c-0.6,0-1.1,0.5-1.1,1.1 c0,0.6,0.5,1.1,1.1,1.1h4.1v8.1c0,0.6,0.5,1.1,1.1,1.1h15c0.6,0,1.1-0.5,1.1-1.1v-8.1h4.1c0.6,0,1.1-0.5,1.1-1.1 C29.9,15.4,29.4,14.9,28.8,14.9z M21.4,23h-2.2v-5.9H18l-3,3.7v2.2h2.2l0.7-0.9h3.4V23z M17.9,20.8l1-1.2v1.2H17.9z M14.9,15.3 V12h-0.4c-0.4,1.2-0.9,2-1.5,2.6c-0.6,0.6-1.4,1-2.3,1.2l0.1,0.4h1.3v4.2c0,0.6,0.1,1,0.4,1.3c0.3,0.3,0.7,0.4,1.2,0.4 c0.5,0,0.9-0.1,1.3-0.3l-0.1-0.4c-0.3,0.1-0.6,0.2-0.8,0.2c-0.6,0-0.8-0.4-0.8-1.1v-4.3h1.7V15.3H14.9z M22.8,12 c-1.2,0-2.2,0.4-2.8,1.1c-0.7,0.7-1,1.8-1,3.1s0.3,2.3,1,3c0.7,0.7,1.6,1.1,2.8,1.1c0.7,0,1.3-0.1,1.9-0.4l-0.1-0.4 c-0.5,0.2-1.1,0.3-1.7,0.3c-1,0-1.7-0.3-2.2-0.9c-0.5-0.6-0.8-1.4-0.8-2.5v-0.3h5v-0.6c0-1.1-0.3-1.9-0.8-2.5 C24.5,12.3,23.8,12,22.8,12z M24.8,15.6H20c0-0.9,0.2-1.6,0.6-2.1c0.4-0.5,1-0.8,1.9-0.8c0.8,0,1.4,0.2,1.8,0.7 C24.6,13.9,24.8,14.6,24.8,15.6z"/>
        </symbol>
    </svg>
    
    <!-- Load JavaScript -->
    <script type="module" src="./src/js/main.js"></script>
</body>
</html>
